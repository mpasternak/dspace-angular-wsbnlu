<button
  type="button"
  [class]="buttonClass"
  (click)="openCitationModal()"
  [attr.aria-label]="'citation-export.button.aria-label' | translate">
  @if (showIcon) {
    <i class="fas fa-quote-right" aria-hidden="true"></i>
  }
  @if (showText) {
    <span>
      {{ 'citation-export.button.label' | translate }}
    </span>
  }
</button>
